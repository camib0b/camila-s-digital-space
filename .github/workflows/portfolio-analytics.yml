name: portfolio analytics

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analytics-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-api/package-lock.json
      - run: npm ci
      - run: npm test
